name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: ./build.sh
  windows:
    runs-on: windows-latest
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build AcsTool.sln -c Release
      - run: ./publish.ps1
        shell: pwsh
      - run: ./out/win-x64/AcsTool.exe --smoke-exit
        shell: pwsh
