name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - run: dotnet --info
      - name: guard - network tests must not be skipped in CI
        run: |
          if [ -n "${ACSTOOL_SKIP_NET_TIMEOUT:-}" ]; then
            echo "::error::ACSTOOL_SKIP_NET_TIMEOUT is set; CI must run Connect_UnroutableAddress_ConnectTimedOut"; exit 1
          fi
      - run: ./build.sh
  windows:
    runs-on: windows-latest
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - run: dotnet --info
      - name: build and test (build.ps1 -NoCoverage; includes the ACSTOOL_SKIP_NET_TIMEOUT guard)
        shell: pwsh
        run: ./build.ps1 -NoCoverage
      - run: ./publish.ps1
        shell: pwsh
      - name: smoke start (--smoke-exit)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./out/win-x64/AcsTool.exe -ArgumentList '--smoke-exit' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AcsTool --smoke-exit failed with exit code $($p.ExitCode)" }
