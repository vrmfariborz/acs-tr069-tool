name: ci
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: ./build.sh
  windows:
    runs-on: windows-latest
    env: { CI: 'true' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build AcsTool.sln -c Release
      - run: ./publish.ps1
        shell: pwsh
      - name: smoke start (--smoke-exit)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./out/win-x64/AcsTool.exe -ArgumentList '--smoke-exit' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AcsTool --smoke-exit failed with exit code $($p.ExitCode)" }
